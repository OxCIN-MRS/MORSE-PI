[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "morse-pi"
version = "0.2.0"
description = "MORSE-PI coil sensitivity estimation"
readme = "readme.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "William Clarke", email = "william.clarke@ndcn.ox.ac.uk" },
  { name = "Chiara Coletti", email = "chiara.coletti@ndcn.ox.ac.uk" },
]
dependencies = [
  "numpy>=2.5.3,<3",
  "scipy>=1.18.1,<2",
  "mri-nufft>=1.4.0,<2",
  "torchkbnufft>=1.5.0,<2",
]

[dependency-groups]
dev = [
  "ipykernel>=7.3.0,<8",
  "matplotlib>=3.11.2,<4",
  "ruff>=0.16.9,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.12"

[tool.pixi.pypi-dependencies]
morse-pi = { path = ".", editable = true }

[tool.pixi.environments]
default = ["dev"]
